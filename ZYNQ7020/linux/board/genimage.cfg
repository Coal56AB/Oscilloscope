image boot.vfat {
    vfat {
        extraargs = "-F 32"
        files = { "BOOT.BIN", "boot.scr", "zImage", "oscill-zynq7020.dtb" }
    }
    size = 64M
}
image sdcard.img {
    hdimage { fill = true }
    size = 128M
    partition boot {
        partition-type = 0x0c
        bootable = true
        offset = 1M
        image = "boot.vfat"
    }
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.squashfs"
        autoresize = true
    }
}
